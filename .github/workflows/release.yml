---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Stage npm package and create GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release version
        run: |
          package_version="$(node -p "require('./package.json').version")"
          manifest_version="$(node -p "require('./.cursor-plugin/plugin.json').version")"
          source_version="$(node -p "require('fs').readFileSync('src/version.ts','utf8').match(/\"([^\"]+)\"/)[1]")"
          if [[ "$GITHUB_REF_NAME" != "v$package_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $package_version" >&2
            exit 1
          fi
          if [[ "$manifest_version" != "$package_version" ]]; then
            echo ".cursor-plugin/plugin.json version $manifest_version does not match package.json" >&2
            exit 1
          fi
          if [[ "$source_version" != "$package_version" ]]; then
            echo "src/version.ts PLUGIN_VERSION $source_version does not match package.json" >&2
            exit 1
          fi
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Test
        run: pnpm test
      - name: Stage npm package
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            pnpm exec npm stage publish --provenance --access public --tag next
          else
            pnpm exec npm stage publish --provenance --access public
          fi
      - name: Create draft GitHub release
        run: gh release create "$GITHUB_REF_NAME" --draft --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

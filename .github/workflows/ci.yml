name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # format:check, tsc --noEmit and a fresh build of dist/.
      - name: Lint
        run: pnpm run lint

      # Cursor installs the plugin straight from Git, so the committed bundle
      # must match the sources.
      - name: Verify committed bundle is current
        run: git diff --exit-code -- dist/

      - name: Test
        run: pnpm test
